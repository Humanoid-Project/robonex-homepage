# ROBONEX 홈페이지 → GitHub Pages 배포
# 빌드 도구 없는 정적 사이트이므로, 배포 대상 파일만 _site 로 모아 업로드합니다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

# GITHUB_TOKEN 에 Pages 배포 권한 부여
permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 동시에 하나만. 진행 중인 배포는 취소하지 않음(중간 상태 방지)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 사이트 번들 생성
    runs-on: ubuntu-latest
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v5

      # enablement: true → 저장소에 Pages 사이트가 없으면 직접 생성하고
      # 빌드 소스를 GitHub Actions 로 설정합니다. (수동 설정 대체)
      - name: Pages 설정 로드
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 배포 대상 수집
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_site' \
            ./ _site/
          # Jekyll 전처리 방지 (밑줄로 시작하는 경로 보호)
          touch _site/.nojekyll

      - name: 필수 파일 확인
        run: |
          for f in index.html css/style.css js/main.js assets/favicon.svg; do
            if [ ! -f "_site/$f" ]; then
              echo "::error file=$f::배포 번들에 $f 이(가) 없습니다"
              exit 1
            fi
          done
          echo "번들 확인 완료"
          ls -R _site

      - name: 아티팩트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Pages 배포
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages 로 배포
        id: deployment
        uses: actions/deploy-pages@v4
